name: Windows EXE derle

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -U "yt-dlp[default]"

      - name: FFmpeg ve Deno indir (bin\)
        run: python scripts/fetch_ffmpeg.py

      - name: Testler
        run: python -m pytest -q tests

      - name: Web paketini üret
        run: python scripts/build_web.py

      - name: Kaynağı karart (PyArmor)
        run: python scripts/build_obfuscate.py

      - name: PyInstaller ile EXE oluştur
        run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath build/work build/getliyo.spec

      - name: EXE içeriğini doğrula (eksik paket varsa derlemeyi durdur)
        shell: pwsh
        run: |
          $missing = @()
          # Derlenmiş (.pyd/.dll) dosyalar: exe arşivinin dosya listesi
          $files = pyi-archive_viewer -l -b dist\getliyo.exe 2>&1 | Out-String
          foreach ($f in 'PySide6\QtWidgets.pyd', 'PySide6\QtCore.pyd', 'PySide6\QtGui.pyd', 'PySide6\Qt6Core.dll') {
            if (-not $files.Contains($f)) { $missing += $f }
          }
          # Python modülleri: PyInstaller'ın PYZ içerik listesi
          $pyz = Get-Content build\work\getliyo\PYZ-00.toc -Raw
          foreach ($m in 'httpx', 'fastapi', 'starlette', 'pydantic', 'yt_dlp', 'bs4', 'PIL', 'uvicorn', 'server.app') {
            if ($pyz -notmatch "'$([regex]::Escape($m))[.']") { $missing += $m }
          }
          if ($missing) { Write-Host "EXE içinde eksik: $($missing -join ', ')"; exit 1 }
          Write-Host "EXE içeriği tamam."

      - name: Kurulum programı (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc installer\getliyo.iss

      - name: Zip paketle (EXE + bin)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item dist\getliyo.exe out\
          Copy-Item bin out\bin -Recurse -Exclude .gitkeep
          Compress-Archive -Path out\* -DestinationPath getliyo-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: getliyo-windows
          path: |
            getliyo-windows.zip
            Output/getliyo-setup.exe

      - name: Release'e ekle
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" getliyo-windows.zip Output/getliyo-setup.exe --clobber
