<!doctype html>
<html lang="{{LANG}}" dir="{{DIR}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{t:result.title}} — getliyo</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script src="/device.js"></script>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="nav"><div class="wrap nav-in">
  <a class="logo" href="/{{LANG}}/" aria-label="{{t:nav.home}}"><img class="logo-mark" src="/brand-mark.png" alt=""><span>getliyo</span></a>
</div></header>

<div class="wrap">
  <div class="ad ad-top" data-slot="top" role="complementary" aria-label="{{t:ad.label}}"></div>
</div>

<div class="wrap layout">
  <main id="main" tabindex="-1">
    {{BODY}}
    <div class="ad ad-inline" data-slot="inline" role="complementary" aria-label="{{t:ad.label}}"></div>
  </main>
  <aside class="side" aria-label="{{t:ad.label}}">
    <div class="ad ad-side" data-slot="side"></div>
  </aside>
</div>

<div class="wrap">
  <div class="ad ad-bottom" data-slot="bottom" role="complementary" aria-label="{{t:ad.label}}"></div>
</div>

<footer class="foot">
  <div class="wrap foot-in">
    <p class="disclaimer">{{t:foot.disclaimer}}</p>
    <nav aria-label="{{t:foot.nav}}">
      <a href="/{{LANG}}/terms">{{t:foot.terms}}</a>
      <a href="/{{LANG}}/privacy">{{t:foot.privacy}}</a>
      <a href="/{{LANG}}/copyright">{{t:foot.copyright}}</a>
      <a href="/{{LANG}}/cookies">{{t:foot.cookies}}</a>
      <a href="/{{LANG}}/contact">{{t:foot.contact}}</a>
      <a href="#cerez" id="cookie-link" hidden>{{t:foot.cookie_prefs}}</a>
    </nav>
    <span id="copyright"></span>
  </div>
</footer>

<div id="cookie-banner" class="cookie" role="dialog" aria-modal="false" aria-labelledby="cookie-title" hidden>
  <div class="wrap cookie-in">
    <p id="cookie-title">{{t:cookie.text}} <a href="/{{LANG}}/cookies">{{t:cookie.more}}</a></p>
    <div class="cookie-actions">
      <button id="cookie-reject" class="btn">{{t:cookie.reject}}</button>
      <button id="cookie-accept" class="btn">{{t:cookie.accept}}</button>
    </div>
  </div>
</div>

<script src="/guard.js"></script>
<script src="/lang.js"></script>
<script src="/site-config.js"></script>
<script src="/consent.js" defer></script>
<script src="/ads.js" defer></script>
</body>
</html>
